name: Build odin 5.4 kernelsu.ko

on:
  workflow_dispatch:
    inputs:
      kmi_name:
        description: 'ko 名字, 要和 ksud late-load --kmi 一致'
        required: true
        default: 'android11-5.4'
      odin_branch:
        description: 'odin 内核分支'
        required: true
        default: 'odin-r-oss'
      tree_repo:
        description: '内核源码仓库（可换成第三方维护的 odin 树）'
        required: true
        default: 'https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git'
      config_path:
        description: '内核 config 路径(留空=自动探测)'
        required: false
        default: ''
      first_cc:
        description: '首选编译器'
        required: true
        type: choice
        options: ['clang', 'gcc']
        default: 'clang'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: 腾磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev cpio python3 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang lld llvm git curl
          aarch64-linux-gnu-gcc --version | head -1
          clang --version | head -1

      - name: 克隆 odin 内核
        run: |
          git clone --depth 1 --single-branch -b "${{ inputs.odin_branch }}" \
            "${{ inputs.tree_repo }}" odin
          find odin/arch/arm64/configs -type f -name '*odin*' | head -20
          head -5 odin/Makefile | grep -E 'VERSION|PATCHLEVEL|SUBLEVEL'

      - name: 配置内核
        run: |
          set -euo pipefail
          cd odin

          CFG="${{ inputs.config_path }}"
          # 仓库自带的设备真实配置（由官方 OTA boot.img 的 IKCONFIG 提取）
          if [ -z "$CFG" ] && [ -f "$GITHUB_WORKSPACE/device.config" ]; then
            echo "使用设备真实配置 device.config（$(wc -c < "$GITHUB_WORKSPACE/device.config") 字节）"
            cp "$GITHUB_WORKSPACE/device.config" .config
            CFG="__DEVICE__"
          fi
          if [ -z "$CFG" ] && [ ! -f .config ]; then
            for c in arch/arm64/configs/vendor/odin_QGKI.config \
                     arch/arm64/configs/vendor/odin_defconfig \
                     arch/arm64/configs/odin_QGKI.config \
                     arch/arm64/configs/odin_defconfig \
                     arch/arm64/configs/vendor/odin-perf_defconfig; do
              [ -f "$c" ] && { CFG="$c"; break; }
            done
          fi
          if [ "$CFG" != "__DEVICE__" ]; then
            [ -n "$CFG" ] && [ -f "$CFG" ] || { echo "::error::没找到 config"; exit 1; }
          fi

          echo "--- 仓库里全部 arm64 config ---"
          find arch/arm64/configs -type f | sed 's|arch/arm64/configs/||' | sort | head -40

          if [ "$CFG" = "__DEVICE__" ]; then
            REL="__DEVICE__"
          else
            REL="${CFG#arch/arm64/configs/}"
          fi
          echo "target fragment=$CFG rel=$REL"
          case "$REL" in
            __DEVICE__)  : ;;
            *_defconfig)
              make ARCH=arm64 "$REL"
              ;;
            *)
              # odin_QGKI.config 是 fragment，必须合并到 base defconfig 上
              BASE=""
              for b in gki_defconfig vendor/gki_defconfig vendor/odin_defconfig odin_defconfig; do
                [ -f "arch/arm64/configs/$b" ] && { BASE="$b"; break; }
              done
              if [ -n "$BASE" ]; then
                echo "base defconfig = $BASE，merge $REL"
                make ARCH=arm64 "$BASE"
                scripts/kconfig/merge_config.sh -m -O "$(pwd)" .config "arch/arm64/configs/$REL"
              else
                echo "!! 没有找到 base defconfig，直接把 fragment 当 .config"
                cp "$CFG" .config
              fi
              ;;
          esac

          for opt in KPROBES EXT4_FS MODULES KALLSYMS SECCOMP SECCOMP_FILTER \
                     AUDIT SECURITY SECURITY_NETWORK SECURITY_SELINUX; do
            grep -q "^CONFIG_${opt}=y" .config || ./scripts/config --file .config -e "$opt"
          done
          ./scripts/config --file .config -d KSU || true
          # 5.4 Makefile 给 clang 传的 -enable-trivial-auto-var-init-zero... 已被新版 clang 删除
          ./scripts/config --file .config -d INIT_STACK_ALL_ZERO -d INIT_STACK_ALL -e INIT_STACK_NONE || true

          make ARCH=arm64 olddefconfig

          echo "--- SECURITY_SELINUX 依赖 ---"
          sed -n '/^config SECURITY_SELINUX$/,/^config /p' security/selinux/Kconfig 2>/dev/null | head -12
          echo "--- 依赖项当前状态 ---"
          grep -E '^CONFIG_(AUDIT|AUDITSYSCALL|NET|INET|SECURITY_NETWORK|SECURITY_SELINUX)=' .config || echo "(缺)"

          for must in CONFIG_ARM64 CONFIG_MODULES CONFIG_KALLSYMS CONFIG_KPROBES CONFIG_SECCOMP; do
            grep -q "^${must}=y" .config || { echo "::error::配置缺少 ${must}=y"; exit 1; }
          done

          echo "================ 关键配置 ================"
          grep -E '^CONFIG_(MODULES|MODULE_SIG|MODULE_SIG_FORCE|MODVERSIONS|KPROBES|KALLSYMS|EXT4_FS|SECCOMP|SECCOMP_FILTER|SECURITY_SELINUX)=' .config || true
          echo "=========================================="
          echo "================ ABI 关键项 =============="
          grep -E '^CONFIG_(ARM64_VA_BITS|ARM64_4K_PAGES|ARM64_16K_PAGES|ARM64_64K_PAGES|ARM64_PAGE_SHIFT|SMP|NR_CPUS|PREEMPT|PREEMPT_NONE|PREEMPT_VOLUNTARY|THREAD_INFO_IN_TASK|HARDENED_USERCOPY|SECURITY|SECURITY_SELINUX|MODULE_SIG)=' .config || true
          echo "=========================================="

          if grep -q '^CONFIG_MODULE_SIG_FORCE=y' .config; then
            echo "::error::内核启用了 CONFIG_MODULE_SIG_FORCE"; exit 1
          fi

      - name: 编译前准备
        run: |
          set -euo pipefail
          cd odin
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- scripts
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare || true
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- security/selinux/ || true
          if [ ! -f security/selinux/flask.h ]; then
            make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- scripts/selinux/genheaders/genheaders 2>/dev/null || true
            make -j"$(nproc)" -C scripts/selinux/genheaders 2>/dev/null || true
            make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- scripts || true
            GEN=$(find "$(pwd)" -type f -name genheaders -perm -u+x | head -1)
            echo "genheaders=$GEN"
            if [ -n "$GEN" ]; then
              "$GEN" security/selinux/flask.h security/selinux/include/classmap.h && echo "手工生成 flask.h 成功"
              "$GEN" security/selinux/av_permissions.h security/selinux/include/classmap.h || true
            fi
          fi
          echo "--- selinux 生成头 ---"
          if [ -f security/selinux/flask.h ]; then
            ls -l security/selinux/flask.h security/selinux/av_permissions.h
          else
            echo "::error::flask.h 仍未生成，security/selinux 无法编译"
            find . -name 'flask.h' -o -name 'av_permissions.h' | head
            exit 1
          fi

      - name: 编译 kernelsu.ko
        run: |
          set -uo pipefail
          KDIR="$GITHUB_WORKSPACE/odin"
          MSRC="$GITHUB_WORKSPACE/ksu/kernel"
          echo "module src: $MSRC"

          build_with() {
            local tag="$1"; shift
            echo "=== 尝试编译: $tag ==="
            make -j"$(nproc)" -k -C "$KDIR" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
                 "$@" M="$MSRC" CONFIG_KSU=m KSU_KERNEL_DIR="$MSRC" modules 2>&1 | tee "build-$tag.log"
            local rc=${PIPESTATUS[0]}
            echo "退出码: $rc"
            if [ "$rc" -eq 0 ] && [ -f "$MSRC/kernelsu.ko" ]; then
              echo "OK:$tag" > .build-result
              return 0
            fi
            rm -f "$MSRC/kernelsu.ko"
            return 1
          }

          CLANG_ARGS=(CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
                      OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
                      CLANG_TRIPLE=aarch64-linux-gnu-)
          GCC_ARGS=(CC=aarch64-linux-gnu-gcc LD=aarch64-linux-gnu-ld)

          if [ "${{ inputs.first_cc }}" = "clang" ]; then
            build_with clang "${CLANG_ARGS[@]}" || build_with gcc "${GCC_ARGS[@]}"
          else
            build_with gcc "${GCC_ARGS[@]}" || build_with clang "${CLANG_ARGS[@]}"
          fi

          if [ ! -f .build-result ]; then
            echo "::error::编译失败"
            echo "===== 去重后的错误 ====="
            grep -hE "error:" build-*.log | sed 's|.*/ksu/kernel/||' | sort -u | head -40
            exit 1
          fi
          cat .build-result

      - name: 打包产物
        if: always()
        run: |
          set -uo pipefail
          mkdir -p out
          KO="ksu/kernel/kernelsu.ko"
          if [ -f "$KO" ]; then
            OUT="out/${{ inputs.kmi_name }}_kernelsu.ko"
            cp "$KO" "$OUT"
            llvm-strip -d "$OUT" 2>/dev/null || true
            ls -l "$OUT"
            file "$OUT" || true
            readelf -h "$OUT" | grep -E 'Type|Machine' || true
            strings -a "$OUT" | grep -m1 '^vermagic=' || echo "(no vermagic, ksuinit 会补)"
            readelf -sW "$OUT" | awk '$7=="UND"{print $8}' | grep -v '^$' | sort -u | tee out/undefined-symbols.txt | wc -l
          else
            echo "::warning::没有产出 kernelsu.ko"
          fi

      - name: 上传
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-ko-${{ inputs.kmi_name }}
          path: |
            out/*
            build-*.log
          if-no-files-found: warn
